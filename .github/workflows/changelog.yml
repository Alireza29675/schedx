name: Changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create PR if changelog changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet CHANGELOG.md && exit 0

          branch="chore/update-changelog"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add CHANGELOG.md
          git commit -m "chore: update changelog"
          git push -u origin "$branch" --force

          existing=$(gh pr list --head "$branch" --state open --json number -q '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create --title "chore: update changelog" --body "Auto-generated by git-cliff." --head "$branch" --base main
          fi
