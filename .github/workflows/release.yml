name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6ef61257f1ba4f48db31f746e5ad0414c26e
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0

      - name: Validate tag version
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "schedx") | .version')"
          test "v${crate_version}" = "${GITHUB_REF_NAME}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" --generate-notes

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: schedx
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: schedx
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: schedx
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: schedx
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: schedx.exe
            cross: false
    steps:
      - uses: actions/checkout@93cb6ef61257f1ba4f48db31f746e5ad0414c26e
        with:
          persist-credentials: false

      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal --target "${{ matrix.target }}"
          rustup default 1.85.0

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Package artifact
        shell: bash
        run: |
          asset="schedx-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$asset" "${{ matrix.bin }}"

      - name: Upload asset to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" "schedx-${{ matrix.target }}.tar.gz" --clobber

  publish:
    name: Publish crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6ef61257f1ba4f48db31f746e5ad0414c26e
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  finalize:
    name: Finalize Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6ef61257f1ba4f48db31f746e5ad0414c26e
        with:
          persist-credentials: false

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh release download "${GITHUB_REF_NAME}" --dir artifacts --pattern 'schedx-*.tar.gz'

      - name: Generate checksums
        run: |
          sha256sum artifacts/*.tar.gz > artifacts/checksums.txt

      - name: Upload checksums and installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" artifacts/checksums.txt install.sh install.ps1 --clobber

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
