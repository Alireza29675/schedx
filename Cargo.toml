[package]
name = "schedx"
version = "0.6.1"
edition = "2024"
rust-version = "1.85.0"
description = "Scheduler CLI for recurring jobs, agent prompts, and webhooks"
license = "MIT"
repository = "https://github.com/Alireza29675/schedx"
homepage = "https://github.com/Alireza29675/schedx"
readme = "README.md"
keywords = ["scheduler", "cron", "cli", "automation", "agent"]
categories = ["command-line-utilities"]

[[bin]]
name = "schedx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
cron = "0.15"
nanoid = "0.4"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
fs4 = "0.12"
dirs = "6"
shell-words = "1"
url = "2"
ctrlc = "3"
libc = "0.2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
